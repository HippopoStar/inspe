services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    expose:
      - "11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      # Optimisations strictes pour 4 Go de VRAM (RTX 3050)
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_FLASH_ATTENTION=1
      # Contexte de 8k tokens + cache KV q8_0 : un modèle 4B tient entièrement dans les 4 Go de VRAM
      # (16k + q4_0 débordait sur le CPU et dégradait la qualité). Vérifier avec : docker exec ollama ollama ps
      - OLLAMA_CONTEXT_LENGTH=8192
      - OLLAMA_KV_CACHE_TYPE=q8_0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-net

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open_webui_data:/app/backend/data
      - ./workspace:/app/backend/data/workspace_shared:ro
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # Force l'embedding RAG sur CPU pour préserver les 4 Go de VRAM pour le LLM
      - RAG_EMBEDDING_ENGINE=
      # Modèle d'embedding multilingue (le défaut all-MiniLM-L6-v2 ne gère que l'anglais).
      # Après un changement : Admin > Paramètres > Documents > réindexer.
      - RAG_EMBEDDING_MODEL=BAAI/bge-m3
      - USE_CUDA_DOCKER=false
      - ENABLE_OLLAMA_API=true
      - ENABLE_OPENAI_API=false
      - WEBUI_AUTH=false
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - ai-net

  pi:
    build:
      context: ./pi
      dockerfile: Dockerfile
    image: local-pi-agent:latest
    user: "1000:1000"
    profiles: ["cli"]
    stdin_open: true
    tty: true
    working_dir: /workspace
    volumes:
      - ./workspace:/workspace
      # Protège les instructions et scripts contre toute modification accidentelle par le LLM
      - ./pi/config/AGENTS.md:/home/node/.pi/agent/AGENTS.md:ro
      - ./pi/config/models.json:/home/node/.pi/agent/models.json:ro
      - ./pi/config/skills:/home/node/.pi/agent/skills:ro
      - ./pi/config/sessions:/home/node/.pi/agent/sessions
      # Clés API : un fichier par clé dans ./secrets (ex. secrets/openalex_api_key), lu dans /run/secrets
      # comme des docker secrets. Monté en dossier plutôt qu'en `secrets:` car compose exige que chaque
      # fichier déclaré existe ; ici chaque clé reste facultative. Voir : search_manager.py sources --check
      - ./secrets:/run/secrets:ro
    environment:
      # Utilisé par search_manager.py rank (API native Ollama, sans « réflexion »)
      - OLLAMA_HOST=http://ollama:11434
      - RANK_MODEL=${RANK_MODEL:-qwen3:4b}
    security_opt:
      - no-new-privileges:true
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - ai-net

volumes:
  ollama_data:
  open_webui_data:

networks:
  ai-net:
    driver: bridge

